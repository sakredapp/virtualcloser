; Ofelia: the box's scheduler. Replaces the Vercel crons in vercel.json.
; Each job runs inside the ofelia container (job-local) and calls the app over
; the compose network with the cron bearer secret. CRON_SECRET comes from the
; ofelia container's environment (docker-compose.yml), never from this file.
[global]
save-folder = /var/log/ofelia
save-only-on-error = false

; Box watchdog: stale-worker check + app_errors retention. Not in vercel.json
; (Vercel runs it elsewhere); on a box it is the heartbeat we test.
[job-local "health-check"]
schedule = @every 5m
command = /bin/sh /etc/ofelia/hit.sh /api/cron/health-check

; vercel.json: "0 11 * * *"
[job-local "due-reminders"]
schedule = 0 0 11 * * *
command = /bin/sh /etc/ofelia/hit.sh /api/cron/due-reminders

; vercel.json: "0 10 * * *" (QuickBooks; does nothing until the client connects it)
[job-local "qbo-sync"]
schedule = 0 0 10 * * *
command = /bin/sh /etc/ofelia/hit.sh /api/cron/qbo-sync

; vercel.json pinnacle-sync (*/15) is Pinnacle-only and is NOT scheduled on a box.
