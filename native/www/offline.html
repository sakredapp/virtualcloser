<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Suite CXO</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Shown by the native code when a page fails to load (server.errorPath).
       Plain page on purpose: Android gives this screen no native plugins. -->
  <main>
    <img class="mark" src="mark.png" alt="Suite CXO" width="168" height="168">
    <section>
      <h1>That page did not load</h1>
      <p class="quiet">The connection dropped or the server did not answer. Nothing was lost.</p>
      <button type="button" class="primary" onclick="location.replace('index.html')">Try again</button>
    </section>
  </main>
</body>
</html>
